name: android

# Android only. It runs for changes under android/ and shared/ (and for this file) and never for Swift-only changes;
# it does not call, trigger or change build.yml, consumer-check.yml or swift-tests.yml.
# Fixtures live in Tests/VideoEngineTests/Fixtures and are read from there; a change to those files alone does not
# start this workflow (shared/fixtures/manifest.json, which describes them, does).
on:
  push:
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # JVM unit tests (route vectors, capability report, probe against manifest.json), lint, the release AAR and the sample APK.
      - name: Test, lint, assemble
        working-directory: android
        run: >-
          ./gradlew --no-daemon --console=plain
          :videoengine:testDebugUnitTest :videoengine:lintDebug :videoengine:assembleRelease
          :sample:assembleDebug :sample:lintDebug

      - name: Collect artifacts
        run: |
          set -euo pipefail
          aar=android/videoengine/build/outputs/aar/videoengine-release.aar
          apk=android/sample/build/outputs/apk/debug/sample-debug.apk
          test -s "$aar"
          test -s "$apk"
          echo "-- AAR contents --"
          unzip -l "$aar"
          # Stage 1 has no native code, so the AAR carries no jni/ folder. From stage 3 it carries exactly these two ABIs.
          abis=$(unzip -Z1 "$aar" | grep -E '^jni/[^/]+/' | cut -d/ -f2 | sort -u || true)
          echo "ABIs inside the AAR: ${abis:-none (no native code yet)}"
          for abi in $abis; do
            case "$abi" in arm64-v8a|armeabi-v7a) ;; *) echo "unexpected ABI $abi in the AAR"; exit 1 ;; esac
          done
          mkdir dist
          cp "$aar" dist/videoengine-release.aar
          cp "$apk" dist/videoengine-sample-debug.apk
          (cd dist && sha256sum videoengine-release.aar > videoengine-release.aar.sha256 && sha256sum videoengine-sample-debug.apk > videoengine-sample-debug.apk.sha256)
          cat dist/*.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: videoengine-aar
          path: |
            dist/videoengine-release.aar
            dist/videoengine-release.aar.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: videoengine-sample-debug-apk
          path: |
            dist/videoengine-sample-debug.apk
            dist/videoengine-sample-debug.apk.sha256
          if-no-files-found: error
