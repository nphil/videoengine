org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ABIs the AAR and the sample APK carry (docs/PLATFORMS.md D8). Stage 1 has no native code, so the AAR is the same
# for both; naming them now means the FFmpeg libraries of stage 3 arrive with no build change.
videoengine.abis=arm64-v8a,armeabi-v7a
